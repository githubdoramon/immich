name: Build and Publish ECR Images

on:
  push:
    branches: [custom]
  workflow_dispatch:

permissions:
  contents: read

# Finish each pair of images before another run updates the moving tags.
concurrency:
  group: ecr-images-custom
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'eu-central-1' }}

jobs:
  build:
    name: Build ${{ matrix.image }}
    if: github.repository == 'githubdoramon/immich' && github.ref == 'refs/heads/custom'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: immich-server
            context: .
            dockerfile: server/Dockerfile
            repository: ${{ vars.ECR_SERVER_REPOSITORY || 'appcalipse/immich-server' }}
          - image: immich-machine-learning
            context: machine-learning
            dockerfile: machine-learning/Dockerfile
            repository: ${{ vars.ECR_ML_REPOSITORY || 'appcalipse/immich-machine-learning' }}
    env:
      ECR_REPOSITORY: ${{ matrix.repository }}
    steps:
      - name: Check AWS secrets
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          for name in AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_ACCOUNT_ID; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Add the ${name} repository secret under Settings > Secrets and variables > Actions."
              exit 1
            fi
          done
          if [[ ! "$AWS_ACCOUNT_ID" =~ ^[0-9]{12}$ ]]; then
            echo "::error::AWS_ACCOUNT_ID must contain the 12-digit AWS account ID."
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configure AWS credentials
        id: aws
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Check AWS account and ECR repository
        env:
          EXPECTED_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
          ACTUAL_ACCOUNT_ID: ${{ steps.aws.outputs.aws-account-id }}
        run: |
          set -euo pipefail
          if [[ "$ACTUAL_ACCOUNT_ID" != "$EXPECTED_ACCOUNT_ID" ]]; then
            echo "::error::The AWS credentials do not belong to AWS_ACCOUNT_ID."
            exit 1
          fi
          aws ecr describe-repositories --repository-names "$ECR_REPOSITORY" > /dev/null

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.login-ecr.outputs.registry }}/${{ matrix.repository }}
          tags: |
            type=raw,value=latest
            type=raw,value=custom
            type=sha,format=long,prefix=commit-

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            DEVICE=cpu
            BUILD_ID=${{ github.run_id }}
            BUILD_IMAGE=${{ steps.login-ecr.outputs.registry }}/${{ matrix.repository }}:commit-${{ github.sha }}
            BUILD_SOURCE_REF=${{ github.ref_name }}
            BUILD_SOURCE_COMMIT=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}-amd64
          cache-to: type=gha,scope=${{ matrix.image }}-amd64,mode=max

      - name: Summarize published image
        env:
          IMAGE: ${{ steps.login-ecr.outputs.registry }}/${{ matrix.repository }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          {
            echo "### Published ${ECR_REPOSITORY}"
            echo
            echo "- Image: \`${IMAGE}:commit-${GITHUB_SHA}\`"
            echo "- Moving tags: \`latest\`, \`custom\`"
            echo "- Digest: \`${DIGEST}\`"
            echo "- Platform: \`linux/amd64\` (CPU)"
          } >> "$GITHUB_STEP_SUMMARY"
